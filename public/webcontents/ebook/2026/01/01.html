 var v=spread();cur=v[0];
 $('pin').value=v.length>1?(v[0]+1)+'-'+(v[1]+1):(v[0]+1);

 var k=s/Z.s;Z.x=pt.x-(pt.x-Z.x)*k;Z.y=pt.y-(pt.y-Z.y)*k;Z.s=s;if(s===1){Z.x=0;Z.y=0}clampPan();applyZ(anim)}
