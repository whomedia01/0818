<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <!-- Chromakey Green Wall Gradients -->
    <radialGradient id="greenWallGlow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#00EE6E"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#008E38"/>
    </radialGradient>
    
    <linearGradient id="greenFloorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B84D"/>
      <stop offset="40%" stop-color="#00993F"/>
      <stop offset="100%" stop-color="#006629"/>
    </linearGradient>

    <!-- Ceiling Panel White LED Light -->
    <linearGradient id="ledPanelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Ceiling Grid Shadow/Depth -->
    <linearGradient id="ceilingBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Studio Space -->
  <rect width="1600" height="1000" fill="#00C853"/>

  <!-- Green Cyclorama Wall (Seamless Green Backdrop) -->
  <rect width="1600" height="1000" fill="url(#greenWallGlow)"/>

  <!-- Cyclorama Corner & Floor Perspective -->
  <!-- Left Wall Perspective Shadow Line -->
  <path d="M 0 0 L 480 620 L 0 1000 Z" fill="#00A843" opacity="0.2"/>
  
  <!-- Studio Floor -->
  <polygon points="0,620 1600,620 1600,1000 0,1000" fill="url(#greenFloorGrad)"/>

  <!-- Floor Soft Reflection from Ceiling LEDs -->
  <ellipse cx="750" cy="780" rx="600" ry="160" fill="#00FF75" opacity="0.25" filter="url(#lightGlow)"/>

  <!-- CEILING GRID WITH RECTANGULAR LED PANELS (Matches user photo) -->
  <g id="ceiling-system">
    <!-- Ceiling Frame Structure (Perspective Skew) -->
    <polygon points="0,0 1600,0 1420,280 180,280" fill="url(#ceilingBaseGrad)"/>
    <polygon points="0,0 1600,0 1420,280 180,280" fill="none" stroke="#334155" stroke-width="4"/>

    <!-- LED Grid Panels (Columns x Rows) -->
    <g fill="url(#ledPanelGrad)" stroke="#1E293B" stroke-width="3.5" filter="url(#lightGlow)">
      <!-- Row 1 (Top / Far Back) -->
      <polygon points="220,15 440,15 425,65 245,65"/>
      <polygon points="460,15 680,15 655,65 445,65"/>
      <polygon points="700,15 920,15 885,65 675,65"/>
      <polygon points="940,15 1160,15 1115,65 905,65"/>
      <polygon points="1180,15 1380,15 1330,65 1135,65"/>

      <!-- Row 2 -->
      <polygon points="260,80 435,80 410,135 280,135"/>
      <polygon points="455,80 650,80 620,135 430,135"/>
      <polygon points="670,80 865,80 830,135 640,135"/>
      <polygon points="885,80 1080,80 1040,135 850,135"/>
      <polygon points="1100,80 1290,80 1235,135 1060,135"/>

      <!-- Row 3 -->
      <polygon points="290,150 425,150 395,210 310,210"/>
      <polygon points="445,150 625,150 590,210 415,210"/>
      <polygon points="645,150 825,150 780,210 610,210"/>
      <polygon points="845,150 1025,150 970,210 800,210"/>
      <polygon points="1045,150 1225,150 1160,210 990,210"/>

      <!-- Row 4 (Front Ceiling Edge) -->
      <polygon points="320,225 415,225 380,270 330,270"/>
      <polygon points="435,225 595,225 555,270 400,270"/>
      <polygon points="615,225 775,225 725,270 575,270"/>
      <polygon points="795,225 955,225 895,270 745,270"/>
      <polygon points="975,225 1135,225 1065,270 915,270"/>
    </g>
  </g>

  <!-- TOP-LEFT OVERHEAD STUDIO SOFTBOX LIGHT FIXTURE -->
  <g transform="translate(20, -10) rotate(12)">
    <polygon points="40,20 260,20 220,120 10,120" fill="#0F172A" stroke="#1E293B" stroke-width="4"/>
    <polygon points="50,30 250,30 215,110 20,110" fill="#F8FAFC" filter="url(#lightGlow)"/>
    <!-- Mounting Bracket -->
    <rect x="110" y="0" width="30" height="20" fill="#334155"/>
  </g>

  <!-- PROFESSIONAL SONY 4K BROADCAST CAMERA RIG ON TRIPOD (Right Foreground) -->
  <g id="broadcast-camera-rig" transform="translate(1080, 260)" filter="url(#softShadow)">
    <!-- Tripod Legs (Heavy-duty aluminum/carbon fiber) -->
    <g stroke="#0F172A" stroke-width="18" stroke-linecap="round">
      <line x1="220" y1="300" x2="50" y2="720"/>
      <line x1="220" y1="300" x2="220" y2="735"/>
      <line x1="220" y1="300" x2="390" y2="720"/>
    </g>
    <!-- Tripod Leg Metallic Inner Tubes -->
    <g stroke="#475569" stroke-width="10" stroke-linecap="round">
      <line x1="220" y1="300" x2="65" y2="680"/>
      <line x1="220" y1="300" x2="220" y2="700"/>
      <line x1="220" y1="300" x2="375" y2="680"/>
    </g>
    <!-- Spreader Braces & Adjustment Clamps -->
    <g stroke="#1E293B" stroke-width="8">
      <line x1="120" y1="480" x2="320" y2="480"/>
      <line x1="160" y1="480" x2="220" y2="400"/>
      <line x1="280" y1="480" x2="220" y2="400"/>
    </g>
    <circle cx="115" cy="480" r="8" fill="#3B82F6"/>
    <circle cx="325" cy="480" r="8" fill="#3B82F6"/>

    <!-- Fluid Head Base & Pan Bar -->
    <rect x="175" y="255" width="90" height="50" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
    <circle cx="220" cy="280" r="12" fill="#2563EB"/>
    <!-- Pan Handle (Extending to the right) -->
    <path d="M 250 275 L 380 320 L 430 380" stroke="#0F172A" stroke-width="14" stroke-linecap="round" fill="none"/>
    <rect x="415" y="365" width="28" height="45" rx="6" fill="#334155"/>

    <!-- Professional Camcorder Body (Sony CineAlta/FX9 style) -->
    <g transform="translate(10, 50)">
      <!-- Main Matte Black Body -->
      <rect x="80" y="60" width="240" height="135" rx="14" fill="#090D16" stroke="#1E293B" stroke-width="5"/>
      
      <!-- Top Handle Bar -->
      <path d="M 100 60 L 100 15 L 290 15 L 290 60" stroke="#090D16" stroke-width="18" fill="none" stroke-linejoin="round"/>
      <rect x="130" y="8" width="130" height="16" rx="6" fill="#334155"/>

      <!-- Directional Shotgun Mic on Top -->
      <rect x="30" y="0" width="130" height="26" rx="13" fill="#1E293B"/>
      <rect x="20" y="3" width="30" height="20" rx="5" fill="#64748B"/>
      <!-- Mic XLR Cable -->
      <path d="M 150 13 Q 180 -10 200 20" fill="none" stroke="#0F172A" stroke-width="6"/>

      <!-- Side Flip-out High-Brite LCD Monitor Screen (Open Position) -->
      <g transform="translate(180, 75)">
        <polygon points="80,-10 0,-30 0,80 80,100" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
        <polygon points="74,-4 6,-22 6,72 74,90" fill="#0284C7"/>
        <!-- Screen UI Details -->
        <text x="16" y="25" font-family="monospace" font-size="14" font-weight="900" fill="#FFFFFF">4K 60P</text>
        <text x="16" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">LIVE CHROMA</text>
        <circle cx="58" cy="18" r="6" fill="#EF4444"/>
      </g>

      <!-- Broadcast 4K Zoom Lens (Large Matte Box / Hood) -->
      <g transform="translate(-80, 70)">
        <!-- Lens Main Barrel -->
        <rect x="30" y="10" width="130" height="95" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
        <!-- Zoom & Focus Grip Rings -->
        <rect x="60" y="8" width="20" height="99" fill="#334155"/>
        <rect x="90" y="8" width="28" height="99" fill="#475569"/>
        <line x1="104" y1="8" x2="104" y2="107" stroke="#38BDF8" stroke-width="3"/>

        <!-- Matte Box Lens Hood -->
        <polygon points="30,5 -20,-15 -20,130 30,110" fill="#090D16" stroke="#334155" stroke-width="3"/>
        <polygon points="-20,-15 -25,-18 -25,133 -20,130" fill="#475569"/>

        <!-- Glass Lens Reflection -->
        <ellipse cx="-20" cy="58" rx="8" ry="45" fill="#38BDF8" opacity="0.85"/>
        <ellipse cx="-18" cy="58" rx="3" ry="25" fill="#FFFFFF" opacity="0.9"/>
      </g>

      <!-- Viewfinder Eyepiece at Rear -->
      <rect x="320" y="70" width="55" height="40" rx="6" fill="#1E293B"/>
      <ellipse cx="375" cy="90" rx="10" ry="20" fill="#0F172A"/>

      <!-- Sony / Pro Brand Badge & LED Indicator -->
      <rect x="210" y="80" width="90" height="26" rx="4" fill="#1E293B"/>
      <text x="220" y="98" font-family="sans-serif" font-size="12" font-weight="900" fill="#38BDF8" letter-spacing="1.5">SONY 4K</text>
      <circle cx="310" cy="93" r="4" fill="#22C55E"/>
    </g>
  </g>

  <!-- OVERLAY BADGE (Bottom Left - Professional Studio Label) -->
  <g transform="translate(60, 870)" filter="url(#softShadow)">
    <rect width="520" height="80" rx="40" fill="#0F172A" opacity="0.92" stroke="#22C55E" stroke-width="2.5"/>
    <!-- Status Icon -->
    <circle cx="45" cy="40" r="22" fill="#22C55E"/>
    <path d="M 35 40 L 42 47 L 55 31" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Text Info -->
    <text x="82" y="38" font-family="'Pretendard', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">6.6m 대형 곡면 무이음 크로마키 세트</text>
    <text x="82" y="62" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#86EFAC">4K 가상 CG 합성 세트 · 천장 그리드 LED 시스템 조명</text>
  </g>
</svg>
